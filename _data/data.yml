projects:
  title: Projects
  intro: >
    Below are some of my key projects demonstrating my skills in machine learning, AI, and software development. Each project highlights my ability to tackle complex problems, implement effective solutions, and deliver impactful results.
  assignments:
  # - title: Multimodal Enterprise Knowledge Management Agent
  #   link: "https://github.com/hongwei-cai/RapidAoV"
  #   tagline: |
  #     <strong>Project Overview</strong><br><br>
  #     A multimodal AI agent built on a Retrieval-Augmented Generation (RAG) architecture to address information silos in enterprise knowledge management. By integrating private document repositories, the system delivers accurate Q&A, knowledge reasoning, and multimodal retrieval to boost decision-making efficiency and knowledge utilization. The project follows agile practices, has completed core iterations, and supports efficient local deployment for enterprise use cases.<br><br>

  #     <strong>Core Iterations</strong><br>
  #     <ul>
  #     <li><strong>Sprint 1 (Completed): End-to-end Text Q&A Pipeline</strong>
  #       <ul>
  #       <li>Implemented intelligent PDF parsing and chunking with a sliding-window strategy and overlapping segments</li>
  #       <li>Integrated ChromaDB vector database and used BAAI/bge-m3 for semantic embeddings and retrieval</li>
  #       <li>Deployed DialoGPT-medium on a local vLLM server for efficient inference</li>
  #       <li>Developed FastAPI endpoints for document upload, Q&A queries, and error handling</li>
  #       <li>Containerized services using Docker and Docker Compose for production-grade orchestration</li>
  #       </ul>
  #     </li>
  #     <li><strong>Sprint 2 (Completed): Model Customization & Performance Optimization</strong>
  #       <ul>
  #       <li>Implemented a LoRA fine-tuning framework to optimize models (e.g., DialoGPT-medium), reducing trainable parameters by 99.67%</li>
  #       <li>Integrated the PEFT library and enabled quantization-friendly optimizations for M1 Pro (4-bit/8-bit) and improved memory management</li>
  #       <li>Built an MLflow experiment tracking system with a SQLite backend to log model metrics and resource usage</li>
  #       <li>Developed an A/B testing framework to compare model versions and support dynamic switching</li>
  #       <li>Implemented model caching and hot-swap mechanisms, improving inference latency by ~29.1%</li>
  #       </ul>
  #     </li>
  #     <li><strong>Sprint 3 (In Progress): Productionization & Multimodal Expansion</strong>
  #       <ul>
  #       <li>Integrated CLIP for image encoding and cross-modal retrieval to support mixed text-image queries</li>
  #       <li>Extended ChromaDB to store multimodal embeddings for joint text-image retrieval</li>
  #       <li>Designed multimodal prompt templates to improve context fusion and inference quality</li>
  #       <li>Architected a production-grade asynchronous service with request queuing and load balancing</li>
  #       </ul>
  #     </li>
  #     </ul><br>

  #     <strong>Tech Stack</strong><br>
  #     <ul>
  #     <li><strong>AI/ML Frameworks</strong>: PyTorch, Transformers, PEFT (LoRA), vLLM, sentence-transformers</li>
  #     <li><strong>Core Models</strong>: BAAI/bge-m3, BAAI/bge-large-zh, DialoGPT-medium, Phi-2, CLIP</li>
  #     <li><strong>Data & Retrieval</strong>: ChromaDB, PyPDF, intelligent text chunking, multimodal embeddings</li>
  #     <li><strong>Backend & Deployment</strong>: FastAPI, Docker, Docker Compose, GitHub Actions</li>
  #     <li><strong>Experimentation & Ops</strong>: MLflow, Pydantic, PyTest, quantization tooling</li>
  #     </ul><br>

  #     <strong>Key Achievements</strong><br>
  #     <ul>
  #     <li><strong>System Architecture</strong>: Designed and implemented a complete RAG pipeline covering document parsing, vector retrieval, LLM inference, and service deployment, capable of handling enterprise-scale document volumes (PDF support with smart chunking to ensure retrieval accuracy)</li>
  #     <li><strong>Performance Improvements</strong>: Applied LoRA fine-tuning and quantization to reduce DialoGPT-medium trainable parameters from 354M to 1.18M (≈99.7% parameter efficiency) and improved inference latency by ~29.1% while maintaining answer quality (validated with MLflow experiments)</li>
  #     <li><strong>Engineering Practices</strong>: Established standardized development workflows including pre-commit checks, type annotations (mypy), and unit test coverage to improve collaboration and maintainability</li>
  #     <li><strong>Business Impact</strong>: Delivered accurate document understanding (answer accuracy >85%), enabled secure local deployment to mitigate data privacy risks, and provided an effective enterprise knowledge management solution</li>
  #     </ul>


  - title: Medical-Expert Card System
    link: "https://github.com/hongwei-cai/RapidAoV"
    tagline: |
      Based on clinical logic, this initiative designs algorithm-guided prompt engineering to construct a generalizable system of physician experience cards. The system aims to structurally extract diagnostic reasoning, treatment preferences, and implicit heuristic rules from medical records. By integrating medical knowledge graphs and belief state machines, it enhances the interpretability, safety, and generalization capabilities of Large Language Models (LLMs) in healthcare scenarios.
      
      Tech Stack: LangChain, Pydantic, Streamlit, Milvus Lite, Algorithmic Prompting, Clinical Reasoning State Machine, Domain Knowledge Injection


  - title: Aortic Valve Insufficiency Diagnosis System
    link: "https://github.com/hongwei-cai/RapidAoV"
    tagline: |
      Developed automated diagnosis system using nnU-Net for 3D medical image segmentation and XGBoost for risk classification. Achieved improved early detection accuracy through radiomic feature analysis and morphological assessment.
      
      Tech Stack: Python, nnU-Net, XGBoost, PyRadiomics, SimpleITK

  - title: Automatic Speech Recognition System
    link: "https://github.com/hongwei-cai/ASR-System"
    tagline: |
      Built ASR system using deep neural networks with CTC loss, implementing Viterbi decoding and beam search optimization for improved transcription accuracy.
      
      Tech Stack: Python, NumPy, Kaldi

  - title: Cross-Modality MRI Synthesis
    link: "https://github.com/hongwei-cai/Cross-Modality-MRI-Synthesis-with-CycleGANs"
    tagline: |
      Implemented CycleGAN architecture for T1/T2 MRI modality translation, enabling enhanced medical imaging workflows.
      
      Tech Stack: PyTorch, MONAI, 3D Slicer

  - title: Netflix Data Wrangling, Exploratory Analysis, and Metadata Enrichment
    link: "https://github.com/hongwei-cai/Netflix-Data-Wrangling-Exploration-Metadata-Enrichment"
    tagline: |
      Performed missing value imputation, duplicate removal, and field standardization using Pandas/NumPy. Visualized content type distribution, country/region release trends, and age rating correlations with Matplotlib/Seaborn/Plotly to extract key business insights. Integrated external ratings (IMDB, Rotten Tomatoes) via OMDb API and enriched data dimensions through feature engineering (genre tags, region mapping). Achieved high predictive performance.
      
      Tech Stack: Python (Pandas, NumPy, Matplotlib, Seaborn, Plotly), data cleaning and preprocessing, EDA visualization, API integration (OMDb), feature engineering, Jupyter Notebook


