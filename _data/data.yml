experiences:
  title: Experience
  info:
    - role: Prompt Engineer
      time: 2025.12 - current
      company: Huaxi Digital Medical Technology Co., Ltd, Chengdu, China
      details: |
        - Structured Medical Reasoning: Translated clinical diagnostic logic (e.g., SOAP) into modular prompt templates. Engineered a "Question-Hypothesis-Reflection-Verification" closed-loop to enhance the digital doctor agent's reasoning accuracy and output explainability in complex medical tasks, effectively reducing hallucinations.
        - Safety & Risk Mitigation: Designed multi-level safety guardrails (e.g., Refusal templates, checklists) and risk mitigation strategies to ensure the safety and compliance of medical dialogues, effectively preventing bias and misinformation.
        - Contextual Engineering Integration: Deeply integrated prompt engineering with context management, handling instruction hierarchies, tool result injection, and session state. Defined requirements for retrieval/memory systems to optimize recall coverage and relevance, ensuring efficient information injection.
        - Full-cycle Optimization: Led an AI-assisted prompt development workflow (Self-Generate/Evaluate/Reflect) and established a PromptOps framework for automated evaluation and regression testing. Drove a data-driven closed-loop (Metrics-Issues-Fixes) to enhance R&D efficiency and quality traceability.

    - role: Software Engineering Intern
      time: 2024.05 - 2024.08
      company: Casey's Store Support Center, USA
      details: |
        - Led .NET 8 upgrade project for 12 Commerce Integration Platform applications, completing ahead of .NET 6 end-of-life deadline
        - Skilled in Agile development practices; actively contribute to Scrum meetings and collaborate effectively across all stages of the SDLC
        - Implemented CI/CD pipelines and DevOps practices, improving deployment efficiency
        - Conducted end-to-end API testing and managed infrastructure through ServiceNow ticketing system
        - Gained exposure to data science workflows and cybersecurity practices through cross-team collaboration

    - role: Graduate Teaching Assistant
      time: 2023.01 - 2025.05
      company: University of Iowa, Computer Science Department, USA
      details: |
        - Teaching assistant for core CS courses: Artificial Intelligence, Data Structures, Programming Languages, Computer Organization
        - Instructed 100+ students in machine learning algorithms, neural networks, and programming languages (Java, C, Haskell)
        - Conducted lab sessions and office hours, improving student comprehension and course performance

