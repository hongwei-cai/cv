projects:
  title: Projects
  intro: >
    Below are some of my key projects demonstrating my skills in machine learning, AI, and software development. Each project highlights my ability to tackle complex problems, implement effective solutions, and deliver impactful results.
  assignments:
  - title: Medical AI Data Pipeline & Expert System
    link: "https://github.com/hongwei-cai/Medical-AI-Data-Pipeline"
    tagline: |
      Engineered a comprehensive Medical AI system enabling unified processing of heterogeneous patient data (Excel & Medical Images) via a robust ETL pipeline. Delivered the full-stack MVP in 3 hours, demonstrating rapid prototyping capabilities.
      <ul>
      <li><strong>Rapid Prototyping</strong>: Delivered the full-stack MVP (ETL, Backend, UI) in 3 hours.</li>
      <li><strong>RAG Engine</strong>: Integrated ChromaDB and LangChain for semantic retrieval and real-time analytics.</li>
      <li><strong>Unified Processing</strong>: Enabled processing of heterogeneous patient data including Excel and Medical Images.</li>
      </ul>
      <strong>Tech Stack</strong>: Python, LangChain, Streamlit, ChromaDB, RAG, Qwen-Max/VL, Pandas, Plotly

 
  - title: Medical-Expert Card System
    link: "https://github.com/hongwei-cai/md-expert-card-system"
    tagline: |
      Built a generalizable physician experience card system to resolve "black box" and "hallucination" issues in medical LLMs. Implemented a "Visit-Trajectory-Knowledge" three-layer architecture for structured clinical data extraction.
      <ul>
      <li><strong>Three-Layer Architecture</strong>: Extracts VisitCard, TrajectoryCard, and KnowledgeCard from unstructured EHRs.</li>
      <li><strong>Controlled RAG</strong>: Features Deterministic Indexing and Hybrid Retrieval for strict evidence citation.</li>
      <li><strong>Algorithm-Guided</strong>: Utilizes prompt engineering to generate temporal disease progression trajectories.</li>
      </ul>
      <strong>Tech Stack</strong>: LangChain (LCEL), Pydantic, Milvus, Streamlit, Python, Pytest


  - title: Aortic Valve Insufficiency Diagnosis System
    link: "https://github.com/hongwei-cai/RapidAoV"
    tagline: |
      Developed an automated diagnosis system combining 3D medical image segmentation and risk classification for improved early detection.
      <ul>
      <li><strong>3D Segmentation</strong>: Utilized nnU-Net for precise segmentation of medical images.</li>
      <li><strong>Risk Classification</strong>: Implemented XGBoost model for accurate risk assessment.</li>
      <li><strong>Feature Analysis</strong>: Enhanced accuracy through radiomic feature analysis and morphological assessment.</li>
      </ul>
      <strong>Tech Stack</strong>: Python, nnU-Net, XGBoost, PyRadiomics, SimpleITK

  - title: Automatic Speech Recognition System
    link: "https://github.com/hongwei-cai/ASR-System"
    tagline: |
      Built an Automatic Speech Recognition (ASR) system using deep neural networks to improve transcription accuracy.
      <ul>
      <li><strong>Deep Learning</strong>: Implemented DNNs with CTC loss for acoustic modeling.</li>
      <li><strong>Optimization</strong>: Applied Viterbi decoding and beam search for decoding optimization.</li>
      </ul>
      <strong>Tech Stack</strong>: Python, NumPy, Kaldi

  - title: Cross-Modality MRI Synthesis
    link: "https://github.com/hongwei-cai/Cross-Modality-MRI-Synthesis-with-CycleGANs"
    tagline: |
      Implemented CycleGAN architecture for medical image modality translation to enhance imaging workflows.
      <ul>
      <li><strong>Modality Translation</strong>: Achieved high-quality T1/T2 MRI translation.</li>
      <li><strong>Workflow Enhancement</strong>: Enabled better analysis through synthetic data generation.</li>
      </ul>
      <strong>Tech Stack</strong>: PyTorch, MONAI, 3D Slicer

  - title: Netflix Data Wrangling, Exploratory Analysis, and Metadata Enrichment
    link: "https://github.com/hongwei-cai/Netflix-Data-Wrangling-Exploration-Metadata-Enrichment"
    tagline: |
      Performed comprehensive data wrangling, visualization, and enrichment on Netflix datasets to extract key business insights.
      <ul>
      <li><strong>Data Cleaning</strong>: Handled missing values, duplicates, and standardization using Pandas/NumPy.</li>
      <li><strong>Visual Insights</strong>: Visualized trends and correlations with Matplotlib/Seaborn/Plotly.</li>
      <li><strong>Data Enrichment</strong>: Integrated external ratings via OMDb API and performed feature engineering.</li>
      </ul>
      <strong>Tech Stack</strong>: Python (Pandas, NumPy, Matplotlib, Seaborn, Plotly), OMDb API, Jupyter Notebook


