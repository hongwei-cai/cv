career-profile:
  title: Career Profile
  summary: |
    M.S. in Computer Science from the University of Iowa, specializing in large language model (LLM/Transformer) research and industry applications, with strengths in both algorithm innovation and engineering implementation. Proficient in PyTorch and deep learning frameworks, experienced in the full LLM development lifecycle—including pretraining, fine-tuning (LoRA/PEFT), RLHF optimization, knowledge augmentation (RAG/Prompt Engineering), and distributed training/inference acceleration.

    Software Engineering Intern at Casey's Store Support Center (U.S.), led .NET 8 system upgrades and enterprise data platform performance optimization, implementing DevOps and CI/CD pipelines to enhance development efficiency and system stability.

    Extensive AI project experience, including medical image analysis, automatic speech recognition, and multimodal data processing, covering the entire pipeline from data cleaning and model design to training, optimization, and deployment, with strong end-to-end problem-solving skills.

    Adept at integrating AI technologies with business scenarios to drive practical adoption (e.g., healthcare, retail), with strong cross-team collaboration and product-oriented mindset. <strong>Seeking roles in LLM application development, training, or evaluation</strong>, dedicated to solving real-world business challenges and creating sustainable value with AI.

